# Reverse proxy del host, delante del contenedor web (127.0.0.1:8081).
#
# Va en /etc/nginx/sites-available/albumviajes y se enlaza desde sites-enabled.
# El certificado lo emite certbot:
#
#   sudo certbot --nginx -d viajes.tu-dominio.com
#
# certbot anade por su cuenta el bloque 443 con las rutas del certificado y la
# redireccion desde el 80, asi que aqui solo se declara el sitio en claro.

server {
    listen 80;
    listen [::]:80;
    server_name viajes.tu-dominio.com;

    # Las fotos originales pueden pesar decenas de MB.
    client_max_body_size 32m;

    # El stream de radio no termina nunca: sin desactivar el buffer, nginx
    # intentaria acumular la respuesta y el audio no empezaria a sonar.
    location ~ ^/api/cities/[^/]+/music/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # La API lo necesita para emitir la cookie de sesion como Secure y para
        # construir bien el redirect de vuelta desde Google.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
