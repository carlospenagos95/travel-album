# Despliegue en el servidor propio. Las imagenes salen de GHCR, construidas por
# GitHub Actions. Copia .env.example a .env y rellena los valores antes de subir.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # Sin puertos publicados: solo la API la alcanza por la red interna.

  api:
    image: ghcr.io/${GITHUB_OWNER}/album-viajes-api:${API_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: ${PUBLIC_URL}
      # Wikimedia exige identificarse; sin un User-Agent propio responde 403.
      Enrichment__UserAgent: ${WIKIMEDIA_USER_AGENT}
      Enrichment__WikipediaLanguage: ${WIKIPEDIA_LANGUAGE:-es}
      # Radio Browser pide lo mismo que Wikimedia: un User-Agent identificable.
      Music__UserAgent: ${RADIO_USER_AGENT}
      # Catalogo de canciones: el buscador de iTunes, que no pide clave. El pais
      # decide que canciones se ven y cuales estan disponibles.
      Music__LibraryCountry: ${MUSIC_LIBRARY_COUNTRY:-CO}
      # Quien administra el album. El resto del mundo solo lee.
      Auth__AllowedEmails__0: ${OWNER_EMAIL}
      # Las mismas credenciales sirven para entrar y para Google Photos: es un
      # unico cliente OAuth con el permiso photospicker.mediaitems.readonly.
      # El redirect_uri no se configura aqui, la API lo deriva de la peticion y
      # del X-Forwarded-Proto del proxy; en Google Cloud debe estar autorizado
      # exactamente ${PUBLIC_URL}/api/auth/google/callback.
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      # Album y API comparten origen detras del proxy, asi que basta la raiz.
      Auth__PostLoginRedirect: /
      # Descargar un original grande tarda mas que una llamada normal, y el tope
      # por foto protege el disco del servidor de un video o un RAW enorme.
      GooglePhotos__TimeoutSeconds: ${GOOGLE_PHOTOS_TIMEOUT_SECONDS:-120}
      GooglePhotos__MaxPhotoBytes: ${GOOGLE_PHOTOS_MAX_BYTES:-31457280}
      GooglePhotos__DefaultPollIntervalSeconds: ${GOOGLE_PHOTOS_POLL_SECONDS:-5}
      PhotoStorage__RootPath: /data/photos
      PhotoStorage__ThumbnailWidth: ${PHOTO_THUMBNAIL_WIDTH:-480}
    volumes:
      # Las fotos y las claves de Data Protection sobreviven a los redespliegues.
      # Perder las segundas invalida las sesiones y el permiso de Google guardado.
      - photos:/data/photos
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  web:
    image: ghcr.io/${GITHUB_OWNER}/album-viajes-web:${WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    # Sin puertos publicados: quien lo expone es Traefik desde la red `proxy`.
    # `internal` sigue haciendo falta porque el nginx de esta imagen resuelve
    # el nombre `api` para servir /api en el mismo origen.
    networks:
      - proxy
      - internal
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: 'true'
      traefik.docker.network: proxy
      traefik.http.routers.album-viajes.rule: Host(`${PUBLIC_HOST}`)
      traefik.http.routers.album-viajes.entrypoints: web
      traefik.http.services.album-viajes.loadbalancer.server.port: '80'
      homepage.group: Proyectos Personales
      homepage.name: Album de Viajes
      homepage.icon: /icons/album-viajes.png
      homepage.href: ${PUBLIC_URL}
      homepage.description: Album de viajes con mapa de ciudades, fotos de Google Photos, radio local y datos de Wikipedia.
    volumes:
      # Centro y zoom del mapa. Se lee al abrir la pagina, asi que cambiarlo es
      # editar el archivo y recargar: no hace falta reconstruir la imagen.
      - ./config.js:/usr/share/nginx/html/config.js:ro

networks:
  # La crea Traefik; aqui solo se engancha.
  proxy:
    external: true
  # Trafico entre web, api y db: no sale del host.
  internal:
    driver: bridge

volumes:
  pgdata:
  photos:
  dataprotection:
