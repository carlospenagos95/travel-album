server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los assets con hash en el nombre nunca cambian de contenido.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La configuracion se edita en el servidor: nunca debe quedarse cacheada.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # El stream de radio no termina nunca. Con el buffer activado nginx intentaria
    # acumular la respuesta antes de entregarla y el audio no empezaria a sonar.
    location ~ ^/api/cities/[^/]+/music/[^/]+/stream$ {
        proxy_pass http://api:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La API vive detras del mismo origen: no hay CORS que resolver en el navegador.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida la resuelve el router del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
